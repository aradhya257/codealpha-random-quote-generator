<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <div class="card" id="quote-card">
        <p class="quote-text" id="quote">Loading quote...</p>
        <p class="quote-author" id="author">&mdash;</p>
        <div class="controls">
          <button id="theme-toggle" aria-pressed="false" title="Toggle dark mode">🌙</button>
          <button id="new-quote">New Quote</button>
        </div>
      </div>
      <footer class="credit">Random Quote Generator</footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
